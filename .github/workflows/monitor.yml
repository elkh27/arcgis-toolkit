name: Monitor nyc_lyft_demand

on:
  schedule:
    # One hour after the daily sync in nyc-demand-arcgis (10:17 UTC)
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
      ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Health (data must be less than 26 hours old)
        run: arcgis-toolkit health --service nyc_lyft_demand --max-age-hours 26
      - name: Schema drift
        if: always()
        run: arcgis-toolkit validate schemas/nyc_lyft_demand.json
