[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcgis-toolkit"
version = "0.1.0"
description = "Command-line admin toolkit for ArcGIS Online and ArcGIS Location Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcgis>=2.4,<3",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arcgis-toolkit = "arcgis_toolkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]